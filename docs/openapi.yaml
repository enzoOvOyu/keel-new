      type: string
      enum:
      - good
      - degraded
      - failed
      - unknown
    OpsVerdict:
      type: string
      enum:
      - PASS
      - FAIL
      - BLOCKED
      - WAIVED
    OpsAccessPolicy:
      type: object
      required:
      - revision
      - mode
      - allowed_protocols
      - policy_allowed
      - policy_reason
      properties:
        revision:
          type: integer
          minimum: 1
        mode:
          type: string
          enum:
          - delivery_approved
          - ipmi_only
          - retired
        allowed_protocols:
          type: array
          items:
            type: string
            enum:
            - ipmi
            - redfish
            - ssh
            - agent
            - external_readonly
        policy_allowed:
          type: boolean
        policy_reason:
          type: string
        credential_binding_id:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: maintained MUST use ipmi_only and allow only approved IPMI purposes. SSH/Agent/Redfish and proxy
        bypass forbidden; external_readonly is a separately approved observation source, never a device executor.
      allOf:
      - if:
          properties:
            mode:
              const: ipmi_only
        then:
          properties:
            allowed_protocols:
              type: array
              items:
                const: ipmi
              maxItems: 1
      - if:
          properties:
            mode:
              const: retired
        then:
          properties:
            allowed_protocols:
              maxItems: 0
            policy_allowed:
              const: false

