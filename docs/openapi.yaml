        kind:
          type: string
        status:
          type: string
        stage:
          type:
          - string
          - 'null'
        progress:
          type: object
          properties:
            current:
              type: integer
            total:
              type: integer
            percent:
              type:
              - number
              - 'null'
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        retryable:
          type: boolean
        error_summary:
          type:
          - string
          - 'null'
