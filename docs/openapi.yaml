openapi: 3.1.0
info:
  title: keel Delivery Platform API
  version: 1.3.0
  description: UI-first API contract for keel. Domain-specific semantics are documented in docs/DOMAIN-API-CONTRACTS.md.
    Remaining generic schemas must be replaced with concrete schemas before implementing the corresponding backend domain.
    Mock and Go implementations must conform to this OpenAPI contract.
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: BOM Import
- name: BOM
- name: Jobs
- name: Health
- name: Projects
- name: CMDB
- name: Inventory
- name: Flows
- name: Executions
- name: Schedules
- name: Fabric
- name: Network Baselines
- name: PushJobs
- name: Gates
- name: Issues
- name: Monitoring
- name: Project Templates
- name: Media
- name: Parameter Catalog
- name: Users
- name: Audit
- name: Auth
- name: Rack Diagrams
- name: Operations
  description: OPS-2026-10-29 post-delivery operations design contract
paths:
  /projects/{project_id}/bom-imports:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    post:
      tags:
      - BOM Import
      summary: Upload raw workbook or standard BOM package
      operationId: createBOMImport
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - template_revision_id
              properties:
                file:
                  type: string
                  format: binary
                template_revision_id:
                  type: string
                source_domain:
                  type: string
                  enum:
                  - network
                  - server
                  - combined
                declared_batch_id:
                  type: string
      responses:
        '202':
          description: Import accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOMImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          $ref: '#/components/responses/Conflict'
  /bom-imports/{import_id}:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    get:
      tags:
      - BOM Import
      summary: Get import status and summary
      operationId: getBOMImport
      responses:
        '200':
          description: Import resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOMImportEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /bom-imports/{import_id}/sheets:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    get:
      tags:
      - BOM Import
      summary: List detected workbook sheets and table regions
      operationId: listImportSheets
      responses:
        '200':
          description: Detected sheet information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SheetListEnvelope'
  /bom-imports/{import_id}/map:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    post:
      tags:
      - BOM Import
      summary: Run deterministic and AI-assisted field mapping
      operationId: mapBOMImport
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping_revision:
                  type: integer
                retry_unmapped_only:
                  type: boolean
                  default: true
      responses:
        '202':
          description: Mapping job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /bom-imports/{import_id}/mappings:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    get:
      tags:
      - BOM Import
      summary: List field mapping candidates
      operationId: listBOMMappings
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - candidate
          - confirmed
          - rejected
          - needs_review
      - in: query
        name: source_field
        schema:
          type: string
      responses:
        '200':
          description: Mapping candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingListEnvelope'
  /bom-imports/{import_id}/mappings/{mapping_id}:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    - in: path
      name: mapping_id
      required: true
      schema:
        type: string
    patch:
      tags:
      - BOM Import
      summary: Correct a mapping candidate in draft revision
      operationId: updateBOMMapping
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target_field
              - status
              - change_reason
              properties:
                target_field:
                  type: string
                converter_id:
                  type:
                  - string
                  - 'null'
                status:
                  type: string
                  enum:
                  - confirmed
                  - rejected
                  - needs_review
                change_reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Updated mapping draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/DomainInvalid'
  /bom-imports/{import_id}/validate:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    post:
      tags:
      - BOM Import
      summary: Validate current normalized revision
      operationId: validateBOMImport
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping_revision:
                  type: integer
      responses:
        '202':
          description: Validation job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEnvelope'
  /bom-imports/{import_id}/issues:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    get:
      tags:
      - BOM Import
      summary: List validation issues
      operationId: listBOMImportIssues
      parameters:
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - BLOCK
          - WARN
          - INFO
      - in: query
        name: status
        schema:
          type: string
          enum:
          - open
          - resolved
          - accepted_warning
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Issue list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueListEnvelope'
  /bom-imports/{import_id}/preview:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    get:
      tags:
      - BOM Import
      summary: Read-only normalized BOM preview and diff
      operationId: previewBOMImport
      responses:
        '200':
          description: Preview with entity counts, issues and diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /bom-imports/{import_id}/build-package:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    post:
      tags:
      - BOM Import
      summary: Build standard BOM package
      operationId: buildBOMPackage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Package build job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEnvelope'
        '422':
          $ref: '#/components/responses/DomainInvalid'
  /bom-imports/{import_id}/commit:
    parameters:
    - $ref: '#/components/parameters/ImportId'
    post:
      tags:
      - BOM Import
      summary: Commit approved server and fabric BOM atomically
      operationId: commitBOMImport
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_revision
              - confirm
              properties:
                expected_revision:
                  type: integer
                confirm:
                  type: boolean
                  const: true
                change_reason:
                  type: string
      responses:
        '201':
          description: BOM batch committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOMBatchEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/DomainInvalid'
  /bom-batches/{batch_id}/items:
    parameters:
    - in: path
      name: batch_id
      required: true
      schema:
        type: string
    get:
      tags:
      - BOM
      summary: List committed BOM items
      operationId: listBOMItems
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: BOM items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOMItemListEnvelope'
  /jobs/{job_id}:
    parameters:
    - in: path
      name: job_id
      required: true
      schema:
        type: string
    get:
      tags:
      - Jobs
      summary: Get asynchronous job status
      operationId: getJob
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEnvelope'
        '404':
