name: keel-dev
services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:5174:5173"
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-mock}
      VITE_MOCK_SCENARIO: ${VITE_MOCK_SCENARIO:-happy-path}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keel}
      POSTGRES_USER: ${POSTGRES_USER:-keel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keel_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: ${MINIO_IMAGE:-keel-minio:2025-10-15-9e49d5e}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keel_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-keel_local_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
